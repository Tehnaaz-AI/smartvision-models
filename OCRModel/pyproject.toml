[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartvision-ocr"
version = "0.1.0"
description = "OCR module for the SmartVision smart-glasses assistive reading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.1",
    "transformers>=4.46.3",
    "Pillow>=11.0.0",
    "pandas>=2.2.3",
    "jiwer>=3.0.5",
    "datasets>=3.1.0",
    "accelerate>=1.1.1",
    "numpy>=1.26.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
